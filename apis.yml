    / QuickBird archive. Generated from Maxar's published OpenAPI spec (doc.content.maxar.com/maxar-content-
    catalog.html) and wrapped by the open-source `maxarcat` Python client.
  humanURL: https://doc.content.maxar.com/maxar-content-catalog.html
  baseURL: https://api.content.maxar.com/catalog
